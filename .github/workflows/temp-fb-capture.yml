name: Temporary Facebook listing capture

on:
  push:
    branches:
      - tmp/fb-ad-rework-1EmtvAKJHh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and media tools
        run: |
          npm install playwright@1.49.1
          npx playwright install chromium --with-deps
          python -m pip install --upgrade yt-dlp
      - name: Capture logged-out page
        env:
          TARGET_URL: 'https://www.facebook.com/share/1EmtvAKJHh/?mibextid=wwXIfr'
          OUT_DIR: fb_capture
        run: |
          cp tools/fb_capture.js tools/fb_capture.cjs
          node tools/fb_capture.cjs
      - name: Capture listing data and media
        if: always()
        env:
          LISTING_ID: '3259969450854035'
          OUT_DIR: fb_graphql
        run: node tools/fb_graphql_capture.mjs
      - name: Summarize capture
        if: always()
        run: |
          echo '--- browser capture files ---'
          find fb_capture -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          echo '--- graphql capture files ---'
          find fb_graphql -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          echo '--- listing summary ---'
          python - <<'PY'
          import json
          from pathlib import Path
          for folder in ('fb_capture', 'fb_graphql'):
              p = Path(folder) / 'summary.json'
              if p.exists():
                  print(f'## {folder}')
                  print(json.dumps(json.loads(p.read_text()), indent=2)[:30000])
          PY
      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fb-listing-capture
          path: |
            fb_capture/
            fb_graphql/
          if-no-files-found: warn
          retention-days: 1
