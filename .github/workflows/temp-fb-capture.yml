name: Temporary Facebook listing capture

on:
  push:
    branches:
      - tmp/fb-ad-rework-1EmtvAKJHh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and media tools
        run: |
          npm install playwright@1.49.1
          npx playwright install chromium --with-deps
          python -m pip install --upgrade yt-dlp
      - name: Capture listing
        env:
          TARGET_URL: 'https://www.facebook.com/share/1EmtvAKJHh/?mibextid=wwXIfr'
          OUT_DIR: fb_capture
        run: |
          cp tools/fb_capture.js tools/fb_capture.cjs
          node tools/fb_capture.cjs
      - name: Summarize capture
        if: always()
        run: |
          echo '--- files ---'
          find fb_capture -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          echo '--- visible text ---'
          sed -n '1,220p' fb_capture/visible_text.txt || true
          echo '--- summary ---'
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('fb_capture/summary.json')
          if p.exists():
              data = json.loads(p.read_text())
              keep = {k: data.get(k) for k in ['target','gotoError','finalUrl','title']}
              keep['meta'] = data.get('meta', [])
              keep['images'] = data.get('images', [])[:30]
              keep['videos'] = data.get('videos', [])[:20]
              print(json.dumps(keep, indent=2))
          PY
      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fb-listing-capture
          path: fb_capture/
          if-no-files-found: warn
          retention-days: 1
